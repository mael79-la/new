<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sin conexión</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #333;
      padding: 2rem;
      text-align: center;
    }

    .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: #1a1a2e;
    }

    p {
      font-size: 1rem;
      color: #666;
      max-width: 340px;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 2rem;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e74c3c;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .dot.online { background: #2ecc71; animation: none; }

    button {
      padding: 0.8rem 2rem;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 2rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover { background: #1557b0; }
    button:active { transform: scale(0.97); }
    button:disabled { background: #ccc; cursor: not-allowed; }

    .sync-info {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>Sin conexión</h1>
  <p>No hay conexión a internet. Tus datos se guardarán y se sincronizarán automáticamente al reconectar.</p>

  <div class="status">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">Sin conexión</span>
  </div>

  <button id="retryBtn" onclick="reintentar()">Reintentar</button>

  <p class="sync-info">⏳ Los datos pendientes se enviarán solos al recuperar la señal.</p>

  <script>
    function actualizarEstado() {
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      const btn = document.getElementById('retryBtn');

      if (navigator.onLine) {
        dot.classList.add('online');
        text.textContent = 'Conexión recuperada';
        btn.disabled = false;
      } else {
        dot.classList.remove('online');
        text.textContent = 'Sin conexión';
        btn.disabled = true;
      }
    }

    function reintentar() {
      if (navigator.onLine) {
        window.location.href = '/new/';
      }
    }

    window.addEventListener('online', () => {
      actualizarEstado();
      setTimeout(() => { window.location.href = '/new/'; }, 1000);
    });

    window.addEventListener('offline', actualizarEstado);
    actualizarEstado();
  </script>
</body>
</html>

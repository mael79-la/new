<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4CAF50" />
  <title>Sin conexión</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f0f8f0 0%, #e8f5e9 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #2e7d32;
      padding: 2rem;
      text-align: center;
    }

    .robot-wrap {
      position: relative;
      margin-bottom: 1.5rem;
    }

    .robot {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 8px 32px rgba(76,175,80,0.35);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }

    .pulse-ring {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 3px solid rgba(76,175,80,0.4);
      animation: ring 2s ease-out infinite;
    }

    @keyframes ring {
      0%   { transform: scale(1);   opacity: 0.8; }
      100% { transform: scale(1.3); opacity: 0; }
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.6rem;
      color: #1b5e20;
    }

    p {
      font-size: 0.95rem;
      color: #555;
      max-width: 300px;
      line-height: 1.6;
      margin-bottom: 1.8rem;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.88rem;
      color: #777;
      margin-bottom: 1.8rem;
      background: white;
      padding: 0.5rem 1.2rem;
      border-radius: 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #e74c3c;
      animation: blink 1.4s ease-in-out infinite;
    }
    .dot.online { background: #4CAF50; animation: none; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    button {
      padding: 0.85rem 2.2rem;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 4px 12px rgba(76,175,80,0.4);
    }
    button:hover { background: #388e3c; }
    button:active { transform: scale(0.97); }
    button:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }

    .sync-info {
      margin-top: 1.4rem;
      font-size: 0.82rem;
      color: #aaa;
    }
  </style>
</head>

  <h1>Sin conexión</h1>
  <p>Tus datos se guardarán localmente y se sincronizarán automáticamente al recuperar la conexión.</p>

  <div class="status">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">Sin conexión</span>
  </div>

  <button id="retryBtn" onclick="reintentar()" disabled>Reintentar</button>

  <p class="sync-info">⏳ Los datos pendientes se enviarán solos al reconectar.</p>

  <script>
    function actualizarEstado() {
      const dot  = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      const btn  = document.getElementById('retryBtn');
      if (navigator.onLine) {
        dot.classList.add('online');
        text.textContent = 'Conexión recuperada ✅';
        btn.disabled = false;
      } else {
        dot.classList.remove('online');
        text.textContent = 'Sin conexión';
        btn.disabled = true;
      }
    }

    function reintentar() {
      if (navigator.onLine) window.location.href = '/new/';
    }

    window.addEventListener('online',  () => { actualizarEstado(); setTimeout(() => location.href = '/new/', 800); });
    window.addEventListener('offline', actualizarEstado);
    actualizarEstado();
  </script>
